name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential git python3 ripgrep rpm libarchive-tools
      - name: Test, build and package
        run: make rpm
      - name: Verify extracted RPM
        run: python3 test/package.py "dist/powerspike-$(cat VERSION)-1.x86_64.rpm"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: powerspike-x86_64
          path: |
            dist/*.rpm
            dist/*.rpm.sha256
          if-no-files-found: error
